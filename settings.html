<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
    <style>
        body {
            padding: 15px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 5px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
        }
    </style>
</head>

<body>
    <div class="setting-group">
        <label for="days">Show Badge Duration (Days):</label>
        <input type="number" id="days" value="4">
    </div>

    <div class="setting-group">
        <label for="badgeColor">Badge Color:</label>
        <select id="badgeColor">
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="red">Red</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="sky">Sky</option>
            <option value="lime">Lime</option>
            <option value="pink" selected>Pink</option>
            <option value="black">Black</option>
            <option value="grey">Gray</option>
        </select>
        </div>

    <div class="setting-group">
        <label for="badgeLabel">Badge Label:</label>
        <input type="text" id="badgeLabel" value="new">
    </div>

    <button id="save" class="mod-primary">Save</button>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./settings.js"></script>
</body>

</html>
