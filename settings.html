<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
    <style>
        body {
            padding: 15px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 5px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
        }
    </style>
</head>

<body>
    <div class="setting-group">
        <label for="days">Integer Value:</label>
        <input type="number" id="days" value="4">
    </div>

    <div class="setting-group">
        <label for="badgeColor">Color:</label>
        <input type="color" id="badgeColor" value="#FFC0CB">
    </div>

    <div class="setting-group">
        <label for="badgeLabel">String Value:</label>
        <input type="text" id="badgeLabel" value="new">
    </div>

    <button id="save" class="mod-primary">Save</button>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./settings.js"></script>
</body>

</html>
